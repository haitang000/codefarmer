name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Create artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Pack npm artifact
        run: pnpm pack --pack-destination artifacts

      - name: Install and smoke-test packed CLI
        shell: pwsh
        run: |
          $tarball = Get-ChildItem -Path artifacts -Filter '*.tgz' | Select-Object -First 1
          if (-not $tarball) { throw 'pnpm pack did not create a tarball' }
          npm install --global $tarball.FullName
          codefarmer --help
          codefarmer --version

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: codefarmer-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
